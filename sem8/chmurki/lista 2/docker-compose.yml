services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    env_file: .env
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      AUTH_TABLE_NAME: ${AUTH_TABLE_NAME:-micro-chat-auth-users}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "8001:8000"

  chat-service:
    build: ./services/chat-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chatadmin:chatpass@postgres:5432/chatdb
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      MEDIA_SERVICE_URL: http://media-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    depends_on:
      - postgres
    ports:
      - "8002:8000"

  media-service:
    build: ./services/media-service
    env_file: .env
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      MEDIA_TABLE_NAME: ${MEDIA_TABLE_NAME:-micro-chat-media-metadata}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "8003:8000"

  notification-service:
    build: ./services/notification-service
    env_file: .env
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      NOTIFICATIONS_TABLE_NAME: ${NOTIFICATIONS_TABLE_NAME:-micro-chat-notifications}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "8004:8000"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - chat-service
      - media-service
      - notification-service
    ports:
      - "8000:80"

volumes:
  pg_data:
